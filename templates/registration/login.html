{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-6 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-1">Sign in</h1><p class="text-muted mb-4">Payment voucher management</p>
    <form method="post">{% csrf_token %}
      {% if form.errors %}<div class="alert alert-danger">Your username or password was not recognized.</div>{% endif %}
      <div class="mb-3"><label class="form-label" for="{{ form.username.id_for_label }}">Username</label>{{ form.username }}</div>
      <div class="mb-3"><label class="form-label" for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}</div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
  </div></div>
</div></div>
<script>document.querySelectorAll('input').forEach((input) => input.classList.add('form-control'));</script>
{% endblock %}
